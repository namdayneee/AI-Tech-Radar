name: Cleanup Old AI Tech Articles


on:
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: ai-tech-radar-cleanup
  cancel-in-progress: false


jobs:

  cleanup:

    name: Cleanup Old Articles

    runs-on: ubuntu-24.04

    timeout-minutes: 10


    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false


      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Cleanup database
        env:

          SUPABASE_URL:
            ${{ secrets.SUPABASE_URL }}

          SUPABASE_SECRET_KEY:
            ${{ secrets.SUPABASE_SECRET_KEY }}

          RETENTION_LOW_DAYS:
            "30"

          RETENTION_MEDIUM_DAYS:
            "90"

          RETENTION_HIGH_DAYS:
            "365"

        run: python cleanup.py