name: Collect AI Tech News


on:
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: ai-tech-radar-collector
  cancel-in-progress: false


jobs:

  collect:

    runs-on: ubuntu-24.04

    timeout-minutes: 20


    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false


      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # V1 NEWS
      # ======================================================

      - name: Collect News
        env:

          SUPABASE_URL:
            ${{ secrets.SUPABASE_URL }}

          SUPABASE_SECRET_KEY:
            ${{ secrets.SUPABASE_SECRET_KEY }}

          GEMINI_API_KEY:
            ${{ secrets.GEMINI_API_KEY }}

          GEMINI_MODEL:
            gemini-3.5-flash-lite

        run: python collect.py


      # ======================================================
      # V2 TECHNOLOGY RADAR
      # ======================================================

      - name: Collect Technology Radar
        env:

          SUPABASE_URL:
            ${{ secrets.SUPABASE_URL }}

          SUPABASE_SECRET_KEY:
            ${{ secrets.SUPABASE_SECRET_KEY }}

          GEMINI_API_KEY:
            ${{ secrets.GEMINI_API_KEY }}

          GEMINI_MODEL:
            gemini-3.5-flash-lite

        run: python radar_collect.py