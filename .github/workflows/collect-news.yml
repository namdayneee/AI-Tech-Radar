name: Collect AI Tech News

on:
  # Cho phép chạy thủ công từ GitHub Actions
  workflow_dispatch:

  # Chạy tự động 1 lần/ngày
  schedule:
    - cron: "45 6 * * *"
      timezone: "Asia/Ho_Chi_Minh"

# Workflow này chỉ cần đọc source code repository
permissions:
  contents: read

# Không cho 2 collector chạy chồng lên nhau
concurrency:
  group: ai-tech-radar-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect AI Tech News

    # Cố định Ubuntu để tránh thay đổi bất ngờ từ ubuntu-latest
    runs-on: ubuntu-24.04

    # Collector bình thường chỉ mất ~2 phút.
    # 15 phút là đủ dư.
    timeout-minutes: 15

    steps:
      # ======================================================
      # 1. Checkout source code
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ======================================================
      # 2. Setup Python
      # ======================================================
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      # ======================================================
      # 3. Install dependencies
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # 4. Collect news
      # ======================================================
      - name: Collect AI Tech News
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite

        run: python collect.py